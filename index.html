<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Picker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{color-scheme:light dark;--bg:#fff;--fg:#111;--mut:#666;--card:#f0f0f0;--line:#ccc}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--card:#1c1c1c;--line:#333}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column}
  section{flex:1;min-height:0;display:flex;flex-direction:column}
  section[hidden]{display:none}
  .pad{padding:20px;max-width:560px;margin:0 auto;width:100%}
  h1{font-size:20px;margin:0 0 16px}
  button,input{font:inherit}
  button{padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
  button:disabled{opacity:.4}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  header{display:flex;justify-content:space-between;padding:8px 12px;font-size:14px;color:var(--mut)}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--card);touch-action:pan-y}
  #stage img{max-width:100%;max-height:100%;object-fit:contain}
  #url{padding:4px 12px;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar{display:flex;gap:10px;padding:10px}
  #bar button{flex:1;padding:16px;font-size:18px}
  #save{background:#1a7f37;color:#fff;border-color:#1a7f37}
  #pass{background:#b42318;color:#fff;border-color:#b42318}
  #status{color:var(--mut);font-size:14px;white-space:pre-wrap}
</style>
</head>
<body>

<section id="setup"><div class="pad">
  <h1>Image Picker</h1>
  <p>Load one or more .txt files of image URLs (one per line).</p>
  <input type="file" id="files" accept=".txt,text/plain" multiple>
  <p id="info"></p>
  <button id="start" disabled>Start</button>
</div></section>

<section id="review" hidden>
  <header><span id="count"></span><span id="savedCount"></span></header>
  <div id="stage"><img id="img" referrerpolicy="no-referrer" alt="Failed to load"></div>
  <div id="url"></div>
  <div id="bar">
    <button id="pass">Pass</button>
    <button id="undo">Undo</button>
    <button id="save">Save</button>
  </div>
</section>

<section id="done" hidden><div class="pad">
  <h1>Finished</h1>
  <p id="summary"></p>
  <div class="row">
    <label>Max images per zip <input type="number" id="per" value="100" min="1" style="width:80px"></label>
  </div>
  <div class="row">
    <button id="zip">Download ZIP</button>
    <button id="txt">Download saved URLs (.txt)</button>
    <button id="back">Back</button>
  </div>
  <div id="status"></div>
</div></section>

<script>
const $ = id => document.getElementById(id);
let urls = [], i = 0, saved = [], hist = [];

function show(name){
  for (const s of ['setup','review','done']) $(s).hidden = s !== name;
}

$('files').addEventListener('change', async e => {
  const set = new Set();
  for (const f of e.target.files) {
    const t = await f.text();
    t.split(/\r?\n/).map(s => s.trim()).filter(s => /^https?:\/\//i.test(s)).forEach(s => set.add(s));
  }
  urls = [...set];
  $('info').textContent = `${e.target.files.length} file(s), ${urls.length} unique URLs`;
  $('start').disabled = !urls.length;
});

$('start').onclick = () => { i = 0; saved = []; hist = []; show('review'); render(); };

function render(){
  if (i >= urls.length) {
    $('summary').textContent = `Reviewed ${urls.length}, saved ${saved.length}.`;
    $('zip').disabled = $('txt').disabled = !saved.length;
    show('done');
    return;
  }
  show('review');
  $('count').textContent = `${i + 1} / ${urls.length}`;
  $('savedCount').textContent = `Saved: ${saved.length}`;
  $('img').src = urls[i];
  $('url').textContent = urls[i];
  for (let k = 1; k <= 2; k++) {
    if (urls[i + k]) { const p = new Image(); p.referrerPolicy = 'no-referrer'; p.src = urls[i + k]; }
  }
}

function decide(isSave){
  if (i >= urls.length) return;
  hist.push(isSave);
  if (isSave) saved.push(urls[i]);
  i++;
  render();
}
function undo(){
  if (!i) return;
  i--;
  if (hist.pop()) saved.pop();
  render();
}
$('save').onclick = () => decide(true);
$('pass').onclick = () => decide(false);
$('undo').onclick = undo;
$('back').onclick = undo;

document.addEventListener('keydown', e => {
  if ($('review').hidden) return;
  if (e.key === 'ArrowRight' || e.key === 's') decide(true);
  else if (e.key === 'ArrowLeft' || e.key === 'p') decide(false);
  else if (e.key === 'z' || e.key === 'Backspace') undo();
});

// Swipe: right = save, left = pass
let sx = null, sy = null;
$('stage').addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { sx = null; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
$('stage').addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) decide(dx > 0);
});

function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

$('txt').onclick = () => download(new Blob([saved.join('\n')], {type:'text/plain'}), 'saved_urls.txt');

const EXT = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/avif':'avif'};
function fileName(u, k, type){
  const x = new URL(u);
  let base = x.pathname.split('/').pop() || 'image';
  try { base = decodeURIComponent(base); } catch(e) {}
  const m = base.match(/\.([a-z0-9]{2,5})$/i);
  base = base.replace(/\.[a-z0-9]{2,5}$/i, '').replace(/[^\w.-]+/g, '_').slice(0, 80) || 'image';
  const ext = EXT[type] || (m && m[1]) || 'jpg';
  return `${String(k + 1).padStart(4, '0')}_${base}.${ext}`;
}

$('zip').onclick = async () => {
  const per = Math.max(1, parseInt($('per').value) || 100);
  const failed = [];
  let part = 1, zip = new JSZip(), n = 0;
  $('zip').disabled = true;

  const flush = async () => {
    if (!n) return;
    $('status').textContent = `Building zip ${part}…`;
    const blob = await zip.generateAsync({type:'blob', compression:'STORE'});
    download(blob, `selected_${String(part).padStart(2, '0')}.zip`);
    part++; zip = new JSZip(); n = 0;
  };

  for (let k = 0; k < saved.length; k++) {
    $('status').textContent = `Fetching ${k + 1} / ${saved.length}\nFailed so far: ${failed.length}`;
    try {
      const r = await fetch(saved[k], {referrerPolicy:'no-referrer'});
      if (!r.ok) throw new Error(r.status);
      const b = await r.blob();
      zip.file(fileName(saved[k], k, b.type), b);
      n++;
      if (n >= per) await flush();
    } catch (e) { failed.push(saved[k]); }
  }
  await flush();

  if (failed.length) download(new Blob([failed.join('\n')], {type:'text/plain'}), 'failed_urls.txt');
  $('status').textContent = `Done. ${saved.length - failed.length} added to zip(s), ${failed.length} failed.` +
    (failed.length ? '\nFailed URLs were saved as failed_urls.txt (likely blocked by the image host\'s CORS policy).' : '');
  $('zip').disabled = false;
};
</script>
</body>
</html>
